# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.

# Project
version=1.3.1
group=dev.hybridlabs
java_version=25

# Common
minecraft_version=26.2
mod_name=Hybrid Blocks
mod_author=Hybrid Labs
mod_id=hybrid_blocks
license=ARR

credits=MysticKoko, Aqua, Andante, Eggo, Ragno, murphy slaw

description=A mod that adds a variety of useful building blocks to Minecraft

minecraft_version_range=[26.2, 26.3)

kotlin_version=2.4.21

## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2

# Dev only deps
debug_utils_version=1.0.9

# Fabric
modmenu_version=20.0.3
fabric_version=0.161.0+26.2
fabric_loader_version=0.20.1
fabric_kotlin_version=1.14.2

# NeoForge
neoforge_version=26.2.0.93
kotlin_for_forge_version=6.5.0

# Publishing
modrinth_id=61Q9LmD0
curseforge_id=832475

# Gradle
# Daemon reuse, parallel execution and the local build cache are the three settings that dominate
# incremental build time on a multi-subproject mod. jvmargs is sized for the Minecraft
# decompile/remap steps, which are the memory-hungry part of the build.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Toolchains are provisioned by the foojay resolver declared in settings.gradle, so the build no
# longer depends on the developer's JAVA_HOME matching java_version.
org.gradle.java.installations.auto-download=true
