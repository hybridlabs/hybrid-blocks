plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'org.jetbrains.kotlin.jvm'
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }

    maven {
        name = "Ladysnake Libs"
        url  = "https://maven.ladysnake.org/releases"
    }

    maven {
        name = "JamiesWhiteShirt"
        url  = "https://maven.jamieswhiteshirt.com/libs-release"
    }

    maven {
        name = "Debug Utils (GitLab)"
        url  = "https://gitlab.com/api/v4/projects/21830712/packages/maven/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }

    implementation project(":common")
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:$fabric_kotlin_version+kotlin.$kotlin_version"
    implementation 'org.jetbrains:annotations:25.0.0'

    //We still have to load the loader-specific version of any mods included in common

    modApi("com.terraformersmc:modmenu:${modmenu_version}")

    modRuntimeOnly "io.github.flemmli97:debugutils:$minecraft_version-$debug_utils_version-fabric"
    modRuntimeOnly "maven.modrinth:carpet:$carpet_version"
}

// Set up datagen and export the output to be consumed by other projects
configurations {
    datagenOutput
}

fabricApi {
    configureDataGeneration {
        setModId("$mod_id")
        outputDirectory = file("src/generated/resources")
        client = true
        // Datagen lives in its own source set (src/datagen/kotlin) so that datagen-only
        // mod dependencies never reach the compile classpath of the shipped jar.
        createSourceSet = true
    }

    dependencies {
        datagenOutput files(runDatagen)
    }
}

// configureDataGeneration created the '$mod_id' classpath group containing only the datagen
// source set. Add main so Loader sees both outputs as one mod and can find the entrypoint.
loom.mods.named("$mod_id") {
    sourceSet sourceSets.main
}

dependencies {
    // Datagen-only mods. These are on the datagen source set alone: they are absent from the
    // main compile classpath, from remapJar, and from the published POM.
    modDatagenImplementation "maven.modrinth:fantastic-fishery:${fantastic_fishery_version}"
    modDatagenImplementation "maven.modrinth:hybrid-aquatic:${hybrid_aquatic_version}"
    modDatagenImplementation "maven.modrinth:hybrid-birds:${hybrid_birds_version}"

    // Their hard dependencies. Loader refuses to start the datagen run without these.
    modDatagenRuntimeOnly "maven.modrinth:geckolib:${geckolib_version}"
    modDatagenRuntimeOnly "maven.modrinth:biolith:${biolith_version}"
    modDatagenRuntimeOnly "maven.modrinth:trinkets:${trinkets_version}"
    modDatagenRuntimeOnly "maven.modrinth:lithostitched:${lithostitched_version}"
    modDatagenRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
    modDatagenRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"

    // hybrid-aquatic's main entrypoint touches ReachEntityAttributes but does not declare it.
    // It only ships the class in a nested jar, which the dev run does not unpack.
    modDatagenRuntimeOnly "com.jamieswhiteshirt:reach-entity-attributes:${reach_entity_attributes_version}"
}

loom {

    var accessWidenerFile = file("src/main/resources/${mod_id}.accesswidener")
    if (accessWidenerFile.exists()) {
        accessWidenerPath.set(accessWidenerFile)
    } else {
        println "No access widener exists!"
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    compileKotlin {
        source(project(":common").sourceSets.main.allSource)
        inputs.file "../gradle.properties"
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}
